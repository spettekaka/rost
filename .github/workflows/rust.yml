name: Rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RISCV_TARGET: riscv64imac-unknown-none-elf

jobs:
  lint: 
    name: Format
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src
          targets: ${{ env.RISCV_TARGET }}
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (Host)
        run: cargo hclippy

      - name: Clippy (Bare-metal RISC-V)
        run: cargo tclippy


  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src
          targets: ${{ env.RISCV_TARGET }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo kbuild

  host-tests:
    name: Host Unit Tests & Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2

      - name: Run Host Unit Tests
        run: cargo utest

      - name: Run Miri on Host Tests
        run: cargo umiri
